# Paste into the edge nginx (auditPal/deploy/portfolio-hosts.conf on the VPS).
# Needs the joram.app certificate expanded with -d lendloop.joram.app (docs/deployment.md).
server {
    listen 80;
    listen [::]:80;
    server_name lendloop.joram.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lendloop.joram.app;

    ssl_certificate     /etc/letsencrypt/live/joram.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joram.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only the LendLoop webhooks are public. The n8n editor is not routed here.
    location /webhook/lendloop/ {
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 64k;
        set $lendloop_n8n http://lendloop-n8n:5678;
        proxy_pass $lendloop_n8n;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $lendloop_app http://lendloop-app:3000;
        proxy_pass $lendloop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
